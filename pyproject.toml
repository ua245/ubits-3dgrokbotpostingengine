[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "grokbot-publisher"
version = "0.1.0"
description = "Deterministic, rule-following social media Publisher for the Grokbot / ubits.tech content pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "responses>=0.23",
]

[project.scripts]
grokbot-publisher = "grokbot_publisher.cli:main"

[tool.setuptools.packages.find]
include = ["grokbot_publisher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
